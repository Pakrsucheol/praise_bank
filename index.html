<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 칭찬 통장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide 아이콘 라이브러리 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Lucide 아이콘 색상 유지용 */
        .lucide {
            stroke: currentColor;
            fill: none;
        }
    </style>
</head>
<body class="bg-pink-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        /**
         * Lucide 아이콘 래퍼 컴포넌트 (최종 수정 버전)
         */
        const Icon = ({ name, className = "w-6 h-6", size, color, strokeWidth }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    // 기존 내용 삭제
                    iconRef.current.innerHTML = '';
                    
                    // i 태그 생성하여 lucide-icon 속성 부여
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name.toLowerCase().replace(/([a-z])([A-Z])/g, '$1-$2'));
                    
                    if (className) i.className = className;
                    
                    iconRef.current.appendChild(i);

                    // lucide 실행하여 i 태그를 svg로 변환
                    window.lucide.createIcons({
                        attrs: {
                            ...(size && { width: size, height: size }),
                            ...(color && { stroke: color }),
                            ...(strokeWidth && { 'stroke-width': strokeWidth })
                        }
                    });
                }
            }, [name, className, size, color, strokeWidth]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const App = () => {
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [students, setStudents] = useState(['김모아', '소다현', '전소연']);
            const [praises, setPraises] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [showStudentMgmt, setShowStudentMgmt] = useState(false);
            const [newStudentName, setNewStudentName] = useState('');
            const [filter, setFilter] = useState('');
            const [formData, setFormData] = useState({
                teacher: '',
                content: '',
                date: new Date().toISOString().split('T')[0],
                category: '학업'
            });

            // 데이터 영구 저장 (LocalStorage)
            useEffect(() => {
                const savedStudents = localStorage.getItem('praise-app-students');
                if (savedStudents) setStudents(JSON.parse(savedStudents));
            }, []);

            useEffect(() => {
                localStorage.setItem('praise-app-students', JSON.stringify(students));
            }, [students]);

            useEffect(() => {
                if (selectedStudent) {
                    const saved = localStorage.getItem(`praises-${selectedStudent}`);
                    setPraises(saved ? JSON.parse(saved) : []);
                }
            }, [selectedStudent]);

            useEffect(() => {
                if (selectedStudent) {
                    localStorage.setItem(`praises-${selectedStudent}`, JSON.stringify(praises));
                }
            }, [praises, selectedStudent]);

            const stats = useMemo(() => {
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const currentMonthStr = todayStr.slice(0, 7);
                return {
                    todayCount: praises.filter(p => p.date === todayStr).length,
                    monthCount: praises.filter(p => p.date.startsWith(currentMonthStr)).length,
                    totalCount: praises.length
                };
            }, [praises]);

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudentName.trim() || students.includes(newStudentName.trim())) return;
                setStudents([...students, newStudentName.trim()]);
                setNewStudentName('');
            };

            const handleRemoveStudent = (name) => {
                if (confirm(`${name} 학생을 명단에서 삭제하시겠습니까?`)) {
                    setStudents(students.filter(s => s !== name));
                }
            };

            const handleSubmitPraise = (e) => {
                e.preventDefault();
                const newPraise = { ...formData, id: Date.now() };
                setPraises([newPraise, ...praises]);
                setFormData({ ...formData, content: '' });
                setShowForm(false);
            };

            if (!selectedStudent) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 animate-pop">
                        <div className="max-w-md w-full text-center">
                            <div className="mb-10">
                                <div className="inline-block p-5 bg-white rounded-full shadow-lg mb-4 text-pink-500">
                                    <Icon name="users" size={48} />
                                </div>
                                <h1 className="text-4xl font-black text-slate-900 mb-2 tracking-tight">우리반 칭찬 통장</h1>
                                <p className="text-slate-500 font-medium text-lg">기분 좋은 칭찬을 기록해봐요!</p>
                            </div>

                            <div className="grid gap-3 mb-10 max-h-[50vh] overflow-y-auto px-2">
                                {students.map(student => (
                                    <div key={student} className="relative group">
                                        <button 
                                            onClick={() => setSelectedStudent(student)} 
                                            className="w-full bg-white p-5 rounded-2xl shadow-sm border-2 border-transparent hover:border-pink-300 hover:shadow-md transition-all text-xl font-bold text-slate-700 flex justify-between items-center active:scale-95"
                                        >
                                            <div className="flex items-center gap-4">
                                                <div className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-500 font-bold">{student[0]}</div>
                                                {student}
                                            </div>
                                            <Icon name="chevron-right" className="text-pink-200 group-hover:text-pink-400" />
                                        </button>
                                        {showStudentMgmt && (
                                            <button 
                                                onClick={() => handleRemoveStudent(student)} 
                                                className="absolute -right-2 -top-2 bg-red-500 text-white p-2 rounded-full shadow-lg hover:bg-red-600 transition-colors z-10"
                                            >
                                                <Icon name="user-minus" size={16} />
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="bg-white/70 backdrop-blur-md p-5 rounded-3xl border border-white shadow-xl">
                                {!showStudentMgmt ? (
                                    <button 
                                        onClick={() => setShowStudentMgmt(true)} 
                                        className="text-slate-500 hover:text-pink-600 flex items-center justify-center gap-2 w-full py-2 font-bold transition-colors"
                                    >
                                        <Icon name="settings" size={18} /> 학생 명단 관리하기
                                    </button>
                                ) : (
                                    <div className="space-y-4 animate-pop">
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-black text-slate-800 uppercase tracking-widest">명단 편집 모드</span>
                                            <button onClick={() => setShowStudentMgmt(false)} className="text-slate-400 hover:text-slate-600">
                                                <Icon name="x" size={20} />
                                            </button>
                                        </div>
                                        <form onSubmit={handleAddStudent} className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={newStudentName} 
                                                onChange={(e) => setNewStudentName(e.target.value)} 
                                                placeholder="새 친구 이름..." 
                                                className="flex-1 px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-pink-300 bg-white" 
                                            />
                                            <button type="submit" className="bg-pink-500 text-white px-5 py-3 rounded-xl font-bold hover:bg-pink-600 shadow-md transition-all active:scale-95">
                                                추가
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 animate-pop">
                    <div className="max-w-2xl mx-auto">
                        <button 
                            onClick={() => setSelectedStudent(null)} 
                            className="flex items-center gap-2 text-slate-500 hover:text-pink-500 mb-8 font-bold transition-all group"
                        >
                            <Icon name="arrow-left" size={18} className="group-hover:-translate-x-1 transition-transform" /> 학생 목록으로
                        </button>

                        <header className="mb-10 text-center">
                            <div className="inline-block p-4 bg-white rounded-3xl shadow-lg mb-4">
                                <Icon name="heart" size={40} color="#ec4899" strokeWidth={3} />
                            </div>
                            <h1 className="text-4xl font-black text-slate-900 mb-2 tracking-tight">
                                <span className="text-pink-500">{selectedStudent}</span>의 칭찬 통장
                            </h1>
                            <p className="text-slate-500 font-medium">칭찬 한 마디가 큰 힘이 됩니다 ✨</p>
                        </header>

                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-pink-100 flex flex-col items-center">
                                <Icon name="zap" size={20} color="#fbbf24" />
                                <span className="text-slate-400 text-xs font-bold uppercase mb-1">오늘 받은 칭찬</span>
                                <span className="text-4xl font-black text-pink-500 tracking-tighter">{stats.todayCount}<small className="text-lg ml-0.5">회</small></span>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-blue-100 flex flex-col items-center">
                                <Icon name="calendar" size={20} color="#60a5fa" />
                                <span className="text-slate-400 text-xs font-bold uppercase mb-1">이번 달의 기록</span>
                                <span className="text-4xl font-black text-blue-500 tracking-tighter">{stats.monthCount}<small className="text-lg ml-0.5">회</small></span>
                            </div>
                        </div>

                        <div className="flex gap-3 mb-8">
                            <div className="relative flex-1">
                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                                    <Icon name="search" size={18} />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="검색..." 
                                    className="w-full pl-12 pr-4 py-4 rounded-2xl border border-white outline-none bg-white/80 shadow-sm focus:ring-2 focus:ring-pink-300 transition-all font-medium" 
                                    value={filter} 
                                    onChange={(e) => setFilter(e.target.value)} 
                                />
                            </div>
                            <button 
                                onClick={() => setShowForm(true)} 
                                className="bg-pink-500 text-white p-4 rounded-2xl shadow-xl hover:bg-pink-600 active:scale-90 transition-all"
                            >
                                <Icon name="plus" size={28} strokeWidth={3} />
                            </button>
                        </div>

                        {showForm && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl animate-pop">
                                    <div className="flex justify-between items-center mb-8">
                                        <h2 className="text-2xl font-black text-slate-800 tracking-tight">새 칭찬 등록</h2>
                                        <button onClick={() => setShowForm(false)} className="text-slate-400 hover:text-slate-600 p-2">
                                            <Icon name="x" size={24} />
                                        </button>
                                    </div>
                                    <form onSubmit={handleSubmitPraise} className="space-y-6">
                                        <input required type="text" className="w-full p-4 rounded-2xl border border-slate-100 bg-slate-50 outline-none focus:ring-2 focus:ring-pink-300 font-bold" placeholder="선생님 성함" value={formData.teacher} onChange={(e) => setFormData({...formData, teacher: e.target.value})} />
                                        <input type="date" className="w-full p-4 rounded-2xl border border-slate-100 bg-slate-50 outline-none focus:ring-2 focus:ring-pink-300 font-bold" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} />
                                        <textarea required rows="4" className="w-full p-4 rounded-2xl border border-slate-100 bg-slate-50 outline-none focus:ring-2 focus:ring-pink-300 font-bold" placeholder="칭찬 내용" value={formData.content} onChange={(e) => setFormData({...formData, content: e.target.value})} />
                                        <button type="submit" className="w-full bg-pink-500 text-white py-5 rounded-2xl font-black text-lg shadow-lg hover:bg-pink-600 transition-all active:scale-95">기록 저장하기</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        <div className="space-y-5 mb-24">
                            {praises.filter(p => p.content.toLowerCase().includes(filter.toLowerCase()) || p.teacher.toLowerCase().includes(filter.toLowerCase())).map(p => (
                                <div key={p.id} className="bg-white p-7 rounded-[2rem] shadow-sm border border-slate-100 group relative hover:shadow-md transition-all animate-pop">
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-slate-300 text-[10px] font-bold tracking-widest uppercase">{p.date}</span>
                                        <button onClick={() => setPraises(praises.filter(i => i.id !== p.id))} className="text-slate-200 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-1">
                                            <Icon name="trash-2" size={16} />
                                        </button>
                                    </div>
                                    <h3 className="text-xl font-bold text-slate-800 mb-5 italic leading-snug">"{p.content}"</h3>
                                    <div className="flex items-center gap-3 text-sm font-black text-slate-600 border-t border-slate-50 pt-5">
                                        <Icon name="user" size={16} />
                                        {p.teacher} 선생님
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="text-center py-10 opacity-30">
                            <p className="text-xs font-bold text-slate-400 flex items-center justify-center gap-1 uppercase tracking-widest">
                                우리반 칭찬 통장 프로젝트
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
